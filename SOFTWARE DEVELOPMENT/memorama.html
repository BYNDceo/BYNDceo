<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memorama Gladiadores y Dioses</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Nunito", "Segoe UI", sans-serif;
        --primary: #a76d2b;
        --primary-dark: #70461a;
        --accent: #f7d488;
        --success: #28c76f;
        --danger: #d64545;
        --card-size: clamp(80px, 12vw, 140px);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #f0efe9, #d7d0ba 60%, #b6a67a);
        color: #2e1f0f;
        padding: 2rem 1rem 4rem;
      }

      main {
        width: min(1100px, 100%);
        background: rgba(255, 252, 244, 0.92);
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(46, 31, 15, 0.18);
        padding: 2.5rem clamp(1.5rem, 4vw, 3rem);
        backdrop-filter: blur(10px);
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        text-align: center;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.2rem);
        letter-spacing: 1px;
      }

      .subtitle {
        max-width: 55ch;
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        color: #70461a;
        margin: 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        align-items: center;
      }

      .info-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(167, 109, 43, 0.18), rgba(167, 109, 43, 0.35));
        font-weight: 600;
        font-size: 0.95rem;
      }

      .info-pill span {
        font-variant-numeric: tabular-nums;
      }

      button.reset {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      button.reset:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(112, 70, 26, 0.35);
        filter: brightness(1.05);
      }

      button.reset:active {
        transform: translateY(1px);
        box-shadow: 0 5px 15px rgba(112, 70, 26, 0.25);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(var(--card-size), 1fr));
        gap: clamp(0.75rem, 2vw, 1.2rem);
        justify-items: center;
      }

      .card {
        width: var(--card-size);
        aspect-ratio: 3 / 4;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
        cursor: pointer;
        border: none;
        background: transparent;
        padding: 0;
      }

      .card:disabled {
        cursor: default;
      }

      .card-inner {
        position: absolute;
        inset: 0;
        border-radius: clamp(12px, 2vw, 18px);
        overflow: hidden;
        box-shadow: 0 20px 35px rgba(112, 70, 26, 0.22);
        transition: transform 0.5s ease;
        transform-style: preserve-3d;
      }

      .card.is-flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        backface-visibility: hidden;
      }

      .card-front {
        background: linear-gradient(135deg, rgba(167, 109, 43, 0.92), rgba(255, 212, 136, 0.92));
        color: white;
        gap: 0.5rem;
        padding: 1rem;
        text-align: center;
      }

      .card-front svg {
        width: 42%;
        height: auto;
        opacity: 0.85;
        filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.25));
      }

      .card-front span {
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .card-back {
        transform: rotateY(180deg);
        background: radial-gradient(circle at top, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.75));
      }

      .card-back img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.05);
      }

      .card.matched .card-inner {
        animation: celebrate 600ms ease forwards;
      }

      @keyframes celebrate {
        0% {
          transform: rotateY(180deg) scale(1);
          box-shadow: 0 20px 35px rgba(40, 199, 111, 0.2);
        }
        60% {
          transform: rotateY(180deg) scale(1.08);
          box-shadow: 0 30px 45px rgba(40, 199, 111, 0.4);
        }
        100% {
          transform: rotateY(180deg) scale(1.02);
          box-shadow: 0 20px 35px rgba(40, 199, 111, 0.35);
        }
      }

      .status {
        margin-top: 2rem;
        text-align: center;
        font-size: 1.2rem;
        font-weight: 600;
        min-height: 1.4em;
      }

      .status.win {
        color: var(--success);
      }

      .status.lose {
        color: var(--danger);
      }

      @media (max-width: 720px) {
        main {
          padding: 1.8rem 1.2rem 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Memorama de Gladiadores y Dioses</h1>
        <p class="subtitle">
          Observa a los héroes de la arena y a las deidades olímpicas durante 5
          segundos y después encuentra los 15 pares antes de que el tiempo se
          agote. ¡Demuestra tu memoria divina!
        </p>
        <div class="controls">
          <div class="info-pill" id="timer">⏱️ Tiempo: <span>03:00</span></div>
          <div class="info-pill" id="moves">⚔️ Movimientos: <span>0</span></div>
          <div class="info-pill" id="pairs">🏛️ Puntos: <span>0 / 15</span></div>
          <button class="reset" type="button" id="reset">Reiniciar juego</button>
        </div>
      </header>
      <section class="board" id="board" aria-live="polite"></section>
      <p class="status" id="status" role="status" aria-live="assertive"></p>
    </main>

    <template id="card-template">
      <button class="card" type="button" aria-label="Carta de memorama">
        <div class="card-inner">
          <div class="card-face card-front">
            <svg viewBox="0 0 128 128" aria-hidden="true">
              <path
                fill="currentColor"
                d="M64 10c-3.8 0-7.6 2-12.2 6l-26 22.6c-4.2 3.7-4.1 8.5.3 12l25.8 20.9-12.8 28.4c-2.8 6.2-.6 9.5 5.1 7.4L64 100l19.8 7.3c5.7 2.1 7.9-1.2 5.1-7.4l-12.8-28.4 25.8-20.9c4.4-3.5 4.5-8.3.3-12L76.2 16c-4.6-4-8.4-6-12.2-6Z"
              ></path>
            </svg>
            <span>Arena Mythos</span>
          </div>
          <div class="card-face card-back">
            <img loading="lazy" alt="Personaje mitológico" />
          </div>
        </div>
      </button>
    </template>

    <script>
      const TOTAL_PAIRS = 15;
      const START_TIME = 180; // seconds
      const INITIAL_REVEAL_DURATION = 5000; // milliseconds

      const board = document.getElementById("board");
      const cardTemplate = document.getElementById("card-template");
      const timerEl = document.querySelector("#timer span");
      const movesEl = document.querySelector("#moves span");
      const pairsEl = document.querySelector("#pairs span");
      const statusEl = document.getElementById("status");
      const resetButton = document.getElementById("reset");

      const mythicPairs = [
        {
          id: 1,
          name: "Gladiador romano",
          image: "https://loremflickr.com/320/400/gladiator?lock=1",
        },
        {
          id: 2,
          name: "Diosa Atenea",
          image: "https://loremflickr.com/320/400/goddess?lock=2",
        },
        {
          id: 3,
          name: "Hércules",
          image: "https://loremflickr.com/320/400/hercules?lock=3",
        },
        {
          id: 4,
          name: "Diosa Afrodita",
          image: "https://loremflickr.com/320/400/aphrodite?lock=4",
        },
        {
          id: 5,
          name: "Gladiador espartano",
          image: "https://loremflickr.com/320/400/spartan?lock=5",
        },
        {
          id: 6,
          name: "Zeus",
          image: "https://loremflickr.com/320/400/zeus?lock=6",
        },
        {
          id: 7,
          name: "Ares",
          image: "https://loremflickr.com/320/400/ares?lock=7",
        },
        {
          id: 8,
          name: "Diosa Artemisa",
          image: "https://loremflickr.com/320/400/artemis?lock=8",
        },
        {
          id: 9,
          name: "Gladiador tracio",
          image: "https://loremflickr.com/320/400/thracian?lock=9",
        },
        {
          id: 10,
          name: "Poseidón",
          image: "https://loremflickr.com/320/400/poseidon?lock=10",
        },
        {
          id: 11,
          name: "Hera",
          image: "https://loremflickr.com/320/400/hera?lock=11",
        },
        {
          id: 12,
          name: "Gladiador del Coliseo",
          image: "https://loremflickr.com/320/400/colosseum,gladiator?lock=12",
        },
        {
          id: 13,
          name: "Apolo",
          image: "https://loremflickr.com/320/400/apollo?lock=13",
        },
        {
          id: 14,
          name: "Diosa Deméter",
          image: "https://loremflickr.com/320/400/demeter?lock=14",
        },
        {
          id: 15,
          name: "Gladiador galo",
          image: "https://loremflickr.com/320/400/gaul,gladiator?lock=15",
        },
      ];

      let deck = [];
      let flippedCards = [];
      let matchedCards = 0;
      let moves = 0;
      let timerInterval = null;
      let secondsLeft = START_TIME;
      let gameStarted = false;
      let initialRevealTimeout = null;

      const shuffle = (array) => {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const formatTime = (seconds) => {
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        return `${m}:${s}`;
      };

      const updateHUD = () => {
        timerEl.textContent = formatTime(secondsLeft);
        movesEl.textContent = moves;
        pairsEl.textContent = `${matchedCards} / ${TOTAL_PAIRS}`;
      };

      const stopTimer = () => {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      };

      const clearInitialReveal = () => {
        if (initialRevealTimeout) {
          clearTimeout(initialRevealTimeout);
          initialRevealTimeout = null;
        }
      };

      const endGame = (won) => {
        stopTimer();
        statusEl.textContent = won
          ? "¡Gloria eterna! Encontraste todos los pares a tiempo."
          : "El tiempo se agotó. ¡Invoca tu memoria y prueba de nuevo!";
        statusEl.className = won ? "status win" : "status lose";

        board.querySelectorAll(".card").forEach((card) => {
          card.disabled = true;
        });

        gameStarted = false;
      };

      const handleTimerTick = () => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          secondsLeft = 0;
          updateHUD();
          endGame(false);
          return;
        }
        updateHUD();
      };

      const startTimer = () => {
        if (timerInterval) return;
        timerInterval = setInterval(handleTimerTick, 1000);
      };

      const lockBoard = () => {
        board.classList.add("locked");
        board.querySelectorAll(".card").forEach((card) => {
          card.disabled = true;
        });
      };

      const unlockBoard = () => {
        board.classList.remove("locked");
        board.querySelectorAll(".card").forEach((card) => {
          if (!card.classList.contains("matched")) {
            card.disabled = false;
          }
        });
      };

      const resetGame = () => {
        stopTimer();
        clearInitialReveal();
        secondsLeft = START_TIME;
        matchedCards = 0;
        moves = 0;
        flippedCards = [];
        gameStarted = false;
        statusEl.textContent = "";
        statusEl.className = "status";
        board.classList.remove("locked");

        deck = shuffle(
          mythicPairs
            .flatMap((card) => [
              { ...card, instance: 1 },
              { ...card, instance: 2 },
            ])
            .map((card, index) => ({ ...card, uid: `${card.id}-${index}` }))
        );

        board.innerHTML = "";
        deck.forEach((card) => {
          const cardNode = cardTemplate.content.firstElementChild.cloneNode(true);
          const inner = cardNode.querySelector(".card-inner");
          const img = cardNode.querySelector("img");

          cardNode.dataset.cardId = card.id;
          cardNode.dataset.cardName = card.name;
          cardNode.dataset.uid = card.uid;
          cardNode.setAttribute(
            "aria-label",
            `Carta temática ${card.name}, lado oculto`
          );

          img.src = card.image;
          img.alt = card.name;

          cardNode.addEventListener("click", () => handleCardFlip(cardNode));
          cardNode.appendChild(inner);
          board.appendChild(cardNode);
        });

        updateHUD();

        board.querySelectorAll(".card").forEach((card) => {
          card.classList.add("is-flipped");
          card.disabled = true;
        });

        initialRevealTimeout = setTimeout(() => {
          board.querySelectorAll(".card").forEach((card) => {
            card.classList.remove("is-flipped");
            if (!card.classList.contains("matched")) {
              card.disabled = false;
            }
          });

          gameStarted = true;
          startTimer();
        }, INITIAL_REVEAL_DURATION);
      };

      const handleMatch = (first, second) => {
        matchedCards += 1;
        first.classList.add("matched");
        second.classList.add("matched");
        first.setAttribute(
          "aria-label",
          `Carta temática ${first.dataset.cardName} emparejada`
        );
        second.setAttribute(
          "aria-label",
          `Carta temática ${second.dataset.cardName} emparejada`
        );

        setTimeout(() => {
          unlockBoard();
          flippedCards = [];
          if (matchedCards === TOTAL_PAIRS) {
            endGame(true);
          }
        }, 600);
      };

      const handleMismatch = (first, second) => {
        setTimeout(() => {
          first.classList.remove("is-flipped");
          second.classList.remove("is-flipped");
          unlockBoard();
          flippedCards = [];
        }, 800);
      };

      const handleCardFlip = (cardNode) => {
        if (!gameStarted) return;
        if (cardNode.classList.contains("matched")) return;
        if (flippedCards.some((card) => card.dataset.uid === cardNode.dataset.uid))
          return;
        if (board.classList.contains("locked")) return;

        cardNode.classList.add("is-flipped");
        flippedCards.push(cardNode);

        if (flippedCards.length < 2) {
          return;
        }

        moves += 1;
        updateHUD();
        lockBoard();

        const [first, second] = flippedCards;
        const isMatch = first.dataset.cardId === second.dataset.cardId;

        if (isMatch) {
          handleMatch(first, second);
        } else {
          handleMismatch(first, second);
        }
      };

      resetButton.addEventListener("click", resetGame);

      resetGame();
    </script>
  </body>
</html>
